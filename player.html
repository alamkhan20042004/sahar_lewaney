<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Willow Sports Player</title>
    <style>
        body { margin: 0; background-color: black; overflow: hidden; }
        video { width: 100vw; height: 100vh; outline: none; }
    </style>
</head>
<body>

    <video id="video" controls autoplay muted playsinline></video>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <script>
        const video = document.getElementById('video');
        
        // Willow Sports ka direct m3u8 link
        const stream = 'https://amg01269-amg01269c1-distrotv-us-5379.playouts.now.amagi.tv/playlist/amg01269-willowtvfast-willowplus-distrotvus/playlist.m3u8';

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(stream);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play();
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = stream;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    </script>
</body>
</html>
